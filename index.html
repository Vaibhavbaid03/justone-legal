<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JustOne — Privacy Policy and Terms have moved</title>

    <!--
      This page has moved to https://justonejain.github.io/.

      GitHub Pages serves static files only, so there is no way to return a
      real 301 from here. A meta refresh is the closest equivalent: the
      canonical link tells search engines which URL is authoritative, and the
      visible link below is what someone sees if the refresh is blocked.

      Kept rather than deleted because this URL may already be recorded in the
      Play Console, in a store listing, or in someone's bookmarks. Deleting the
      repository would turn every one of those into a 404.
    -->
    <meta http-equiv="refresh" content="0; url=https://justonejain.github.io/" />
    <link rel="canonical" href="https://justonejain.github.io/" />
    <meta name="robots" content="noindex" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f3f0;
        color: #2e2a26;
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #7a8b6f;
      }
    </style>
  </head>
  <body>
    <main>
      <p>JustOne’s Privacy Policy and Terms have moved.</p>
      <p><a href="https://justonejain.github.io/">justonejain.github.io</a></p>
    </main>
    <script>
      // Fallback for the rare client that ignores a meta refresh. `replace`
      // rather than `assign` so this page does not sit in the back history and
      // bounce the visitor forward again when they press back.
      location.replace('https://justonejain.github.io/');
    </script>
  </body>
</html>
